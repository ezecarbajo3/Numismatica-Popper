<header class="mh" id="mh">
    <div class="container mh__row">
      <a href="index.html" class="mh__brand" aria-label="Numismática Popper, ir al inicio">
        <svg class="mh__mono" viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="40" r="37" fill="none" stroke="#cdac6c" stroke-width="1.6"/>
          <circle cx="40" cy="40" r="31" fill="none" stroke="#cdac6c" stroke-width="0.7" stroke-dasharray="2.5 3.5" opacity="0.6"/>
          <text x="40" y="48" text-anchor="middle" fill="#cdac6c" font-family="Cinzel, Georgia, serif" font-size="24" font-weight="500" letter-spacing="3">NP</text>
        </svg>
        <span class="mh__word"><span>Numismática</span> <span>Popper</span></span>
      </a>
      <nav class="mh__nav" aria-label="Principal">
        <a class="mh__link" href="sala.html">Sala de Rarezas</a>
        <a class="mh__link" href="catalogo.html">Catálogo</a>
        <a class="mh__link" href="index.html#como-comprar">Cómo comprar</a>
      </nav>
      <div class="mh__tools">
        <div class="moneda-switch" role="group" aria-label="Ver los precios en">
          <button type="button" data-moneda="USD" aria-pressed="true"><span class="solo-compu">Dólares</span><span class="solo-celu">US$</span></button>
          <button type="button" data-moneda="ARS" aria-pressed="false"><span class="solo-compu">Pesos</span><span class="solo-celu">$</span></button>
        </div>
        <!-- cart.js usa estos tres ids. Su botón de moneda queda oculto: lo
             reemplaza el selector de arriba. -->
        <div class="site-floating-actions" id="siteFloatingActions">
          <button type="button" id="currencyToggleBtn" hidden></button>
          <button type="button" id="floatingCartBtn" class="carrito-btn" aria-label="Ver carrito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="carrito-btn__label">Carrito</span>
            <span class="cart-floating-badge" id="floatingCartBadge">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>
