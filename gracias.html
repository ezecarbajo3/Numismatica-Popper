<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Detalle enviado | Numismática Popper</title>
  <link rel="icon" type="image/png" href="images/og-image.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lora:wght@400&display=swap" />
  <style>
    :root { color-scheme: dark; --bg: #0a0a0a; --text: #f5f0e6; --muted: #b2a38d; --accent: #cfac6b; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Lora", serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; box-sizing: border-box; }
    .check { font-size: 2rem; color: var(--accent); }
    h1 { font-family: "Cinzel", serif; font-size: 1.1rem; letter-spacing: 0.15em; color: var(--accent); margin: 8px 0; }
    p { max-width: 420px; line-height: 1.5; color: var(--muted); margin: 6px 0; }
    a { display: inline-block; margin-top: 18px; padding: 12px 22px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-family: "Cinzel", serif; letter-spacing: 0.1em; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <span class="check">✓</span>
    <h1>DETALLE ENVIADO</h1>
    <p>Te mandamos el detalle de tu pedido por mail. Si no lo ves en unos minutos, mirá en spam.</p>
    <p>Volvé a la tienda para transferir y enviarnos el comprobante por WhatsApp.</p>
    <a href="/">VOLVER A LA TIENDA</a>
  </main>
</body>
</html>
